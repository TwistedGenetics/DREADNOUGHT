# SPDX-License-Identifier: GPL-3.0-only
# DREADNOUGHT firmware build. Every push / PR builds the firmware and runs the tests.
# Releases: the version is in the VERSION file (X.Y; the FM-1 package identity is FM-1_9XXYY00, X0X's scheme).
# A push to main publishes the Release vX.Y with DREADNOUGHT-X.Y.fwsc if it doesn't exist yet, or refreshes that
# Release's files if it does. Pushing a vX.Y tag works too. The flasher site is then redeployed.
#
# From 0.3: DREADNOUGHT's own app and engines on X0X's platform (the x0x-firmware submodule, pinned), built the way
# Carnac OS builds (tools/build_fm1.py). See docs/UPSTREAM.md.
name: build

on:
  push:
    branches: [main, x0x-platform]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages (the font, the measurements)
        run: pip install Pillow fonttools numpy

      - name: Cache JieLi toolchain and SDK files
        uses: actions/cache@v4
        with:
          path: ~/.dreadnought-deps
          key: jieli-deps-${{ runner.os }}-${{ hashFiles('tools/get_deps.sh') }}

      - name: Toolchain and SDK files
        run: tools/get_deps.sh ~/.dreadnought-deps

      - name: Read the version
        id: ver
        run: |
          v=$(tr -d ' \n' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error title=Version::tag ${GITHUB_REF_NAME}, but VERSION says $v"; exit 1
          fi

      - name: Host tests (the engines measured, the app driven from the panel)
        run: sh tests/run_host.sh

      - name: Build the firmware package (with the start-up preflight and the miscompile check)
        run: python3 tools/build_fm1.py --release "${{ steps.ver.outputs.version }}"

      - name: Collect the package
        run: |
          mkdir -p dist
          pkg="build/fm1/DREADNOUGHT-${{ steps.ver.outputs.version }}.fwsc"
          name="DREADNOUGHT-${{ steps.ver.outputs.version }}.fwsc"
          cp "$pkg" "dist/$name"
          cd dist
          sha256sum *.fwsc > SHA256SUMS
          python3 - "$name" <<'EOF'
          import sys, hashlib
          d = open(sys.argv[1], "rb").read()
          ident = "".join(chr((d[i * 0x30 + 0x2F] - i - 1) & 0xFF) for i in range(20) if d[i * 0x30 + 0x2F] != 0x7D)
          print(f"::notice title=package::{sys.argv[1]} identity {ident}, {len(d)} bytes, sha256 {hashlib.sha256(d).hexdigest()[:16]}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-${{ github.sha }}
          path: |
            build/host/*.png
            build/host/*.wav
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Flasher tests
        run: node --test 'web/flasher/test/*.test.mjs' 'web/editor/test/*.test.mjs'

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: [firmware, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist
      - name: Version
        id: ver
        run: |
          v=$(tr -d ' \n' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DREADNOUGHT ${{ steps.ver.outputs.version }} beta
          make_latest: true
          files: |
            dist/DREADNOUGHT-${{ steps.ver.outputs.version }}.fwsc
            dist/SHA256SUMS
          body: |
            DREADNOUGHT — a dark jungle / drum & bass firmware for the **M-VAVE FM-1**: its own app and engines (starting with **REESE**) on X0X's proven platform.

            **Beta: not yet tested on a real FM-1.** Installing custom firmware is at your own risk. Read [RECOVERY.md](https://github.com/${{ github.repository }}/blob/main/docs/RECOVERY.md) before you install.

            **Install:** download `DREADNOUGHT-${{ steps.ver.outputs.version }}.fwsc`, then open the [web flasher](https://twistedgenetics.github.io/DREADNOUGHT/flasher/) in Chrome or Edge with the FM-1 on USB, back up, and pick the file (or choose this release from its list).

            What's new: [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
      - name: Redeploy the flasher site (lists this release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
