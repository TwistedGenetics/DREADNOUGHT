# SPDX-License-Identifier: GPL-3.0-only
# DREADNOUGHT on the M-VAVE SMK-37 Pro and Elite (smk/): built with M-VAVE's SMK37 OPEN SDK (m-vave/smk37_open, pinned)
# and JieLi's Windows toolchain 2.5.3, which the SDK's build script checks file by file. A run with
# `baseline: true` builds the SDK's own APP unchanged (the sizes to compare against).
name: smk37

on:
  push:
    branches: [smk37]
    paths: ["smk/**", "src/**", "tools/**", ".github/workflows/smk37.yml"]
  workflow_dispatch:
    inputs:
      baseline:
        description: "build the SDK's own APP, unchanged"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tables:                                           # (on Linux: the font needs Pillow with libraqm)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy Pillow
      - run: |
          set -e
          mkdir -p gen
          python3 tools/gen_dn_tables.py gen/dn_tables.h >/dev/null
          python3 tools/gen_dn_wt.py gen/dn_wt_tables.h >/dev/null
          python3 tools/gen_dn_font.py gen/dn_font.h
          ls -la gen
      - uses: actions/upload-artifact@v4
        with:
          name: smk-tables-${{ github.run_id }}
          path: gen/
          if-no-files-found: error

  firmware:
    needs: tables
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [pro, elite]
    env:
      SDK_COMMIT: b2d6bcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: m-vave/smk37_open
          path: sdkkit
          fetch-depth: 0
      - name: Pin the SDK
        shell: bash
        run: cd sdkkit && git checkout -q "$SDK_COMMIT" && git log --oneline -1

      - name: JieLi toolchain 2.5.3
        shell: bash
        run: bash tools/ci_step.sh "toolchain" pwsh -NoProfile -File tools/smk_toolchain.ps1

      - uses: actions/download-artifact@v4
        with:
          name: smk-tables-${{ github.run_id }}
          path: gen
      - name: Put DREADNOUGHT in as the APP
        if: ${{ !inputs.baseline }}
        shell: bash
        run: bash tools/ci_step.sh "assemble" python tools/smk_assemble.py sdkkit gen

      - name: Build
        shell: bash
        run: |
          cd sdkkit
          bash ../tools/ci_step.sh "build ${{ matrix.model }}" pwsh -NoProfile -Command ".\sdk\Build.ps1 -Model ${{ matrix.model }} -FirmwareOnly -Toolchain \"$FM1_PI32_TOOLCHAIN\""

      - name: Reports
        if: always()
        shell: bash
        run: |
          cd sdkkit/build/${{ matrix.model }} 2>/dev/null || exit 0
          cat firmware-report.json package-report.json 2>/dev/null | head -80
          r=$(cat firmware-report.json package-report.json 2>/dev/null | tr -d '\r' | grep -E '"(passed|app_image_bytes|allocated_image_bytes|runtime_heap_bytes|FLASH_BIN_SIZE|VM_REAL_SIZE|fits)"' | tr '\n' ' ')
          echo "::notice title=sizes ${{ matrix.model }}::$r"
          ls -la generated || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smk37-${{ matrix.model }}${{ inputs.baseline && '-baseline' || '' }}
          path: |
            sdkkit/build/${{ matrix.model }}/generated/*.fwsc
            sdkkit/build/${{ matrix.model }}/*.json
            sdkkit/build/${{ matrix.model }}/sdk.map
          if-no-files-found: warn
